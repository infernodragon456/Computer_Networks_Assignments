[General]
network = RemoteExecutionNetwork
sim-time-limit = 600s
cpu-time-limit = 300s
debug-on-errors = true

# Graphics
record-eventlog = true
**.vector-recording = true
**.scalar-recording = true

# Output
cmdenv-express-mode = false
cmdenv-interactive = true
# cmdenv-message-trace = true
cmdenv-event-banners = true
**.cmdenv-log-level = info
warmup-period = 2s

# By B22CS061 & B22CS062

# Network configuration
network = src.RemoteExecutionNetwork

# Client connections and finger tables
# Basic ring topology connections
**.client[0].connectedClients = "1,9"
**.client[1].connectedClients = "0,2"
**.client[2].connectedClients = "1,3"
**.client[3].connectedClients = "2,4"
**.client[4].connectedClients = "3,5"
**.client[5].connectedClients = "4,6"
**.client[6].connectedClients = "5,7"
**.client[7].connectedClients = "6,8"
**.client[8].connectedClients = "7,9"
**.client[9].connectedClients = "8,0"

# Chord finger tables (using formula finger[i][k] = (i + 2^k) mod N)
**.client[0].chordFingerTable = "1,2,4,8"
**.client[1].chordFingerTable = "2,3,5,9"
**.client[2].chordFingerTable = "3,4,6,0"
**.client[3].chordFingerTable = "4,5,7,1"
**.client[4].chordFingerTable = "5,6,8,2"
**.client[5].chordFingerTable = "6,7,9,3"
**.client[6].chordFingerTable = "7,8,0,4"
**.client[7].chordFingerTable = "8,9,1,5"
**.client[8].chordFingerTable = "9,0,2,6"
**.client[9].chordFingerTable = "0,1,3,7"

# Set clientId parameters
**.client[0].clientId = 0
**.client[1].clientId = 1
**.client[2].clientId = 2
**.client[3].clientId = 3
**.client[4].clientId = 4
**.client[5].clientId = 5
**.client[6].clientId = 6
**.client[7].clientId = 7
**.client[8].clientId = 8
**.client[9].clientId = 9

# Total number of clients in the network
**.client[*].numClients = 10

# Set up channel parameters for all connections
**.client[*].out[*].channel.datarate = 100Mbps
**.client[*].out[*].channel.delay = 10ms
**.client[*].out[*].channel.typename = "Channel"